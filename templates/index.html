<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Application Tracker</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    
</head>
<body class="container">
   
    <div class="header">
    <a href="/">HOME</a>
    <a href="/about">ABOUT US</a>
    <a href="/contact">CONTACT</a>
    
    <input class="search" type="text">
    <div class="image">
    <img src="C:/Users/ALHADI/Downloads/4x/al-ubaid Asset 2@4x-8.png" alt="image not found"></div>
    </div>
   
    <h1 >Job Applications Tracker</h1>
    
    <table>
        <thead>
            <tr>
                <th>ID   </th>
                <th>Company</th>
                <th>Role</th>
                <th>Date</th>
                <th>Status</th>
                <div id="actions">
                <th >Actions</th>
                </div>

            </tr>
        </thead>
        <tbody>
            {% for job in jobs %}
            <tr>
                <td>{{ job.id }}</td>
                <td>{{ job.company }}</td>
                <td>{{ job.role }}</td>
                <td>{{ job.date_applied.strftime('%Y-%m-%d')}}</td>
                <td>{{ job.status }}</td>
                <td>
                    <!-- The browser sees this as a harmless button that does nothing on its own -->
                <button type="button" onclick="deleteItem('{{ job.id }}')">Delete</button>



                    <a href="/edit/{{ job.id }}">Edit</a>
                </td>
            </tr>
            
            {% endfor %}
            </table>
            </tbody>

        <div class="btn">                                
        <a href="/add">Add</a>
            <script>


async function deleteItem(id) {
    if (!confirm("Are you sure you want to delete this?")) return;

    try {
        // 1. Send the delete request to Flask
        const response = await fetch(`/delete/${id}`, {
            method: 'DELETE',
            headers: {
                'Content-Type': 'application/json'
            }
        });

        // 2. Check if the server responded with a successful status (200-299)
        if (response.ok) {
            // 3. Target the table row element
            const row = document.getElementById(`item-${id}`);
            if (row) {
                row.remove(); // Instantly removes the row from the screen
                alert("Deleted successfully!");
            } else {
                // If it can't find the row ID, it forces a reload so the user sees the change
                window.location.reload(); 
            }
        } else {
            alert(`Failed to delete. Server responded with status: ${response.status}`);
        }
    } catch (error) {
        console.error("Network or script error:", error);
        alert("A connection error occurred while trying to delete.");
    }
}


</script>
        
        
    
    
</body>
</html>
