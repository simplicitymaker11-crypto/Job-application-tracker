<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Application Tracker</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    
</head>
<body class="container">
   
    
    {% include "_header.html" %}
    <h1 >Job Applications Tracker</h1>
    <div class="table-wrapper">
        <table class="records-table">
            <thead>
                <tr>
                    <th scope="col">ID</th>
                    <th scope="col">Company</th>
                    <th scope="col">Role</th>
                    <th scope="col">Date</th>
                    <th scope="col">Status</th>
                    <th scope="col">Actions</th>
                </tr>
            </thead>
            <tbody>
                {% for job in jobs %}
                <tr id="item-{{ job.id }}">
                    <td>{{ job.id }}</td>
                    <td>{{ job.company }}</td>
                    <td>{{ job.role }}</td>
                    <td>{{ job.date_applied.strftime('%Y-%m-%d') }}</td>
                    <td class="status {{ job.status|lower }}">{{ job.status }}</td>
                    <td class="record-actions">
                        <button class="row-action delete-action" type="button" onclick="deleteItem('{{ job.id }}')">Delete</button>
                        <a class="row-action edit-action" href="/edit/{{ job.id }}">Edit</a>
                    </td>
                </tr>
                {% else %}
                <tr>
                    <td class="empty-state" colspan="6">No job applications to display.</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>

    <a class="btn add_btn" href="/add">Add</a>

<script>


async function deleteItem(id) {
    if (!confirm("Are you sure you want to delete this?")) return;

    try {
        // 1. Send the delete request to Flask
        const response = await fetch(`/delete/${id}`, {
            method: 'DELETE',
            headers: {
                'Content-Type': 'application/json'
            }
        });

        // 2. Check if the server responded with a successful status (200-299)
        if (response.ok) {
            // 3. Target the table row element
            const row = document.getElementById(`item-${id}`);
            if (row) {
                row.remove(); // Instantly removes the row from the screen
                alert("Deleted successfully!");
            } else {
                // If it can't find the row ID, it forces a reload so the user sees the change
                window.location.reload(); 
            }
        } else {
            alert(`Failed to delete. Server responded with status: ${response.status}`);
        }
    } catch (error) {
        console.error("Network or script error:", error);
        alert("A connection error occurred while trying to delete.");
    }
}


</script>
        
        
    
    
</body>
</html>
