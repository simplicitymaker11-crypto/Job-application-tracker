<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Application Form</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@600&display=swap" rel="stylesheet">
</head>

    

<body class="container">
    {% include "_header.html" %}
    <h1>Add Job Application</h1>
    
    <form action="/add"  method="post"      class="job_form_input">
        <div id="item1">
        <label for="company">Company</label>
        <input type="text" id="company" name="company" required>
        </div>
        
        <div id="item2"> 
        <label for="role">Role</label>
        <input type="text" id="role" name="role" required>
        </div>

        <div id="item3">
        <label for="date">Date</label>
        <input type="date" id="date" name="date">
        </div>

        <div id="item4">
        <label for="status">Status </label>
        <select id="status" name="status" required>
            <option value="Applied" class="applied">Applied</option>
            <option value="Approved" class="approved">Approved</option>
            <option value="Rejected" class="rejected">Rejected</option>
            <option value="Pending" class="pending">Pending</option>
        </select>
        </div>

        
        <button class="btn add-submit" type="submit">Add Application</button>
        

    </form> 

</body>
</html>
